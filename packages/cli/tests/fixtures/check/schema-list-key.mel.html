<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Members</title>
  <script type="melzin/schema">
    {
      "data": {
        "type": "object",
        "properties": {
          "members": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": { "handle": { "type": "string" }, "name": { "type": "string" } },
              "required": ["handle", "name"]
            }
          }
        },
        "required": ["members"]
      }
    }
  </script>
  <script type="melzin/snapshots">
    {
      "nobody": { "data": { "members": [] } },
      "two": { "data": { "members": [{ "handle": "ana", "name": "Ana" }, { "handle": "bo", "name": "Bo" }] } }
    }
  </script>
</head>
<body>
  <ul>
    <li m-for="member in members" m-text="member.name"></li>
  </ul>
</body>
</html>
