<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>T</title>
  <script type="melzin/schema">
    { "data": { "type": "object", "properties": { "count": { "type": "number" }, "verified": { "type": "boolean" } }, "required": ["count"] }, "events": { "increment": {} } }
  </script>
  <script type="melzin/snapshots">
    { "zero": { "data": { "count": 0, "verified": false } }, "verified": { "data": { "count": 1, "verified": true } }, "counting": { "data": { "count": 3 } } }
  </script>
</head>
<body>
  <p m-text="count"></p>
  <span m-if="verified" m-else>Verified</span>
  <button m-on:click="emit('increment')">Add</button>
</body>
</html>
