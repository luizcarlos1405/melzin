<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile card</title>
  <script type="melzin/schema">
    {
      "data": {
        "type": "object",
        "properties": {
          "user": {
            "type": "object",
            "properties": {
              "name": { "type": "string" },
              "role": { "type": "string" },
              "bio": { "type": "string", "default": "" },
              "followers": { "type": "number" }
            },
            "required": ["name", "role", "followers"]
          }
        },
        "required": ["user"]
      },
      "events": {}
    }
  </script>
  <script type="melzin/snapshots">
    {
      "typical": {
        "data": {
          "user": {
            "name": "Ada Lovelace",
            "role": "Analytical Engine programmer",
            "bio": "Writes the first algorithms for a machine that doesn't exist yet. Into poetical science, horses and very long footnotes.",
            "followers": 1843
          }
        }
      },
      "very long name": {
        "data": {
          "user": {
            "name": "Maria Aparecida dos Santos Albuquerque de Oliveira e Vasconcelos Bragança",
            "role": "Senior Principal Staff Engineer, Developer Experience and Platform Reliability",
            "bio": "Keeps the build green.",
            "followers": 312
          }
        }
      },
      "empty bio": {
        "data": {
          "user": {
            "name": "Grace Hopper",
            "role": "Rear admiral",
            "followers": 52000
          }
        }
      },
      "huge follower count": {
        "data": {
          "user": {
            "name": "Linus",
            "role": "Kernel maintainer",
            "bio": "Talk is cheap. Show me the code.",
            "followers": 987654321
          }
        }
      }
    }
  </script>
</head>
<body>
  <main class="flex min-h-screen items-center justify-center bg-linear-to-br from-brand-50 via-white to-zinc-100 p-6 font-sans">
    <article class="w-full max-w-sm overflow-hidden rounded-3xl bg-white shadow-xl shadow-brand-900/10 ring-1 ring-zinc-900/5">
      <div class="h-28 bg-linear-to-r from-brand-300 via-brand-400 to-brand-600"></div>
      <div class="px-6 pb-6">
        <div class="-mt-10 flex size-20 items-center justify-center rounded-2xl bg-white p-1 shadow-md shadow-brand-900/10">
          <div class="flex size-full items-center justify-center rounded-xl bg-brand-100 text-brand-700">
            <svg class="size-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" stroke-linecap="round"></path>
            </svg>
          </div>
        </div>
        <h1 class="mt-4 text-2xl font-semibold tracking-tight text-balance wrap-anywhere text-zinc-900" m-text="user.name"></h1>
        <p class="mt-1 text-sm font-medium text-brand-700" m-text="user.role"></p>
        <p class="mt-4 text-sm leading-relaxed text-pretty text-zinc-600 empty:hidden" m-text="user.bio"></p>
        <div class="mt-6 flex items-center justify-between gap-4 rounded-2xl bg-zinc-50 px-4 py-3 ring-1 ring-zinc-900/5">
          <div class="min-w-0">
            <p class="text-xs font-medium tracking-wide text-zinc-500 uppercase">Followers</p>
            <p class="truncate text-xl font-semibold tabular-nums text-zinc-900" m-text="user.followers"></p>
          </div>
          <span class="shrink-0 rounded-full bg-brand-500 px-3 py-1 text-xs font-semibold text-brand-950">Member</span>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
