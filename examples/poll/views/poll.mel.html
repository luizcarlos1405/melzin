<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meetup poll</title>
  <script type="melzin/schema">
    {
      "data": {
        "type": "object",
        "properties": {
          "question": { "type": "string" },
          "options": {
            "type": "array",
            "key": "id",
            "minItems": 2,
            "description": "The choices, in the order to show",
            "items": {
              "type": "object",
              "properties": {
                "id": { "type": "string", "description": "What the vote event sends back, like \"pizza\"" },
                "label": { "type": "string", "description": "Like \"Pizza\"" },
                "emoji": { "type": "string", "description": "One emoji for the option's icon, like \"🍕\"" },
                "votes": { "type": "number" },
                "percent": { "type": "string", "description": "Share of all votes, like \"42%\"" }
              },
              "required": ["id", "label", "emoji", "votes", "percent"]
            }
          },
          "totalLabel": { "type": "string", "description": "Like \"12 votes\", or \"No votes yet\"" }
        },
        "required": ["question", "options", "totalLabel"]
      },
      "events": {
        "vote": {
          "description": "One vote for an option",
          "payload": {
            "type": "object",
            "properties": {
              "optionId": { "type": "string", "description": "The id of the option voted for" }
            },
            "required": ["optionId"]
          }
        }
      }
    }
  </script>

            { "id": "tacos", "label": "Tacos", "emoji": "🌮", "votes": 41, "percent": "89%" },
            { "id": "sushi", "label": "Sushi", "emoji": "🍣", "votes": 3, "percent": "7%" }

      "huge numbers": {
        "data": {
          "question": "What should we eat at the next team meetup?",
          "options": [
            { "id": "pizza", "label": "Pizza", "emoji": "🍕", "votes": 1284031, "percent": "28%" },
            { "id": "tacos", "label": "Tacos", "emoji": "🌮", "votes": 987654, "percent": "21%" },

          ],

        }

        "extends": "close race",
        "data": {
          "question": "What should we eat at the next team meetup, keeping in mind that half the team is vegetarian, two people can't have gluten, and the venue only has a microwave and a very old toaster?"
        }

        "extends": "close race",
        "data": {
          "options": [
            { "id": "pizza", "label": "Pizza from the wood-fired place on the corner", "emoji": "🍕", "votes": 8, "percent": "25%" },

</head>
<body>
  <main class="px-4 py-8 sm:py-14">
    <section class="mx-auto w-full max-w-lg overflow-hidden rounded-3xl bg-white shadow-xl shadow-brand-900/10 ring-1 ring-stone-900/5">
      <div class="bg-linear-to-br from-brand-500 via-brand-600 to-brand-700 px-6 pt-6 pb-7 text-white">
        <p class="inline-flex items-center gap-2 rounded-full bg-white/15 px-3 py-1 text-xs font-semibold tracking-wider text-brand-50 uppercase ring-1 ring-white/20">
          <span class="size-1.5 rounded-full bg-white"></span>
          Quick poll
        </p>
        <h1 class="mt-4 text-2xl leading-tight font-semibold tracking-tight text-balance wrap-anywhere sm:text-3xl" m-text="question"></h1>
        <p class="mt-2 text-sm text-brand-100">Pick one. You can vote as often as you like; it's a demo.</p>
      </div>

      <!-- One row per option, in the order the host sends; the schema keys them by id. -->
      <ul class="divide-y divide-stone-100">
        <li class="flex items-center gap-3 px-6 py-4 sm:gap-4" m-for="option in options">
          <span class="flex size-10 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-brand-50 text-xl leading-none sm:size-12 sm:text-2xl" aria-hidden="true" m-text="option.emoji"></span>
          <div class="min-w-0 flex-1">
            <p class="font-semibold text-pretty wrap-anywhere text-stone-900" m-text="option.label"></p>
            <p class="mt-0.5 flex items-center gap-1.5 text-sm text-stone-500">
              <svg class="size-4 shrink-0 text-stone-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-7 8a7 7 0 1 1 14 0H3Z"></path>
              </svg>
              <span class="sr-only">Votes:</span>
              <span class="truncate tabular-nums" m-text="option.votes"></span>
            </p>
          </div>
          <!-- On a phone the share sits above the button, so a long label keeps most of the row. -->
          <div class="flex shrink-0 flex-col items-end gap-1.5 sm:flex-row sm:items-center sm:gap-4">
            <p class="text-right text-lg font-bold tabular-nums text-stone-900 sm:w-14 sm:text-xl" m-text="option.percent"></p>
            <button type="button" class="cursor-pointer rounded-xl bg-brand-600 px-4 py-2 text-sm font-semibold text-white shadow-sm shadow-brand-900/20 transition hover:bg-brand-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 active:scale-95" m-on:click="emit('vote', { optionId: option.id })">Vote<span class="sr-only"> for <span m-text="option.label"></span></span></button>
          </div>
        </li>
      </ul>

      <div class="flex items-center justify-between gap-4 border-t border-stone-100 bg-stone-50 px-6 py-4">
        <p class="text-sm font-semibold tabular-nums text-stone-700" m-text="totalLabel"></p>
        <p class="flex items-center gap-1.5 text-xs text-stone-400">
          <span class="size-2 animate-pulse rounded-full bg-emerald-500"></span>
          Live results
        </p>
      </div>
    </section>
  </main>
</body>
</html>
